[package]
name = "raystylus-contract"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "0.6.0"
mini-alloc = "0.4.2"

[dev-dependencies]

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"

